<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nightmoth</title>
  </head>
  <body>
    <div id="toast" class="toast">
      <img src="/moth-logo.png" alt="" />
      <div class="txt">
        <div class="title" id="t-title"></div>
        <div class="body" id="t-body"></div>
      </div>
      <button id="t-action"></button>
      <button id="t-close" class="x" title="Dismiss">✕</button>
      <div class="timer"><i id="t-bar"></i></div>
    </div>
    <script type="module" src="/src/toast.ts"></script>
  </body>
</html>
