[package]
name = "nightmoth_tap"
version = "0.4.0"
edition = "2021"
description = "Nightmoth taskbar helper: hides the Windows 11 taskbar background inside Explorer"

[lib]
crate-type = ["cdylib"]

[dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Registry", "UI_Core", "Foundation"]

[dependencies.windows-core]
version = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# a panic must never unwind into Explorer
panic = "abort"
