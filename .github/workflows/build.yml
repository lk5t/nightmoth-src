name: Build Nightmoth

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Build installer
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Nightmoth-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Tag a release (git tag v0.1.0 && git push --tags) to publish the .exe
      # to the public repo. Needs a token with access to lk5t/Nightmoth saved
      # as the NIGHTMOTH_RELEASE_TOKEN secret in this repo.
      - name: Publish to lk5t/Nightmoth
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NIGHTMOTH_RELEASE_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe \
            --repo lk5t/Nightmoth --title "Nightmoth $GITHUB_REF_NAME" \
            --notes "Download the installer below. Windows may show a SmartScreen warning: click More info → Run anyway."
