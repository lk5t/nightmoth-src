name: Build Nightmoth

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Build installer
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Nightmoth-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Every push to main refreshes the "latest" release in this repo.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest src-tauri/target/release/bundle/nsis/*.exe \
            --title "Nightmoth (latest build)" --prerelease --target "$GITHUB_SHA" \
            --notes "Built from $GITHUB_SHA. Windows may show a SmartScreen warning: click More info → Run anyway."

      # Push a tag like v0.1.0 for a proper versioned release.
      - name: Publish version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe \
            --title "Nightmoth $GITHUB_REF_NAME" \
            --notes "Windows may show a SmartScreen warning: click More info → Run anyway."
