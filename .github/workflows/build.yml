name: Build Nightmoth

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Build installer
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Nightmoth-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Install the built installer and start the app to make sure it really opens.
      - name: Smoke test (install + launch)
        shell: pwsh
        env:
          NIGHTMOTH_NO_DIALOG: "1"
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:ProgramFiles\Nightmoth" -Filter *.exe -Recurse | Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          Write-Host "Installed exe: $($exe.FullName)"
          $p = Start-Process $exe.FullName -PassThru
          # The runner is an admin account, and WebView2 is slow to start elevated (20-60 s),
          # so wait for the startup steps to show up in the logs instead of a fixed time.
          $need = @("main window ready", "app: engine connected", "widgets window created")
          $deadline = (Get-Date).AddSeconds(150)
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            $l = Get-Content "$env:APPDATA\Nightmoth\nightmoth.log" -Raw -ErrorAction SilentlyContinue
            if ($l -and ($need | Where-Object { $l -notmatch [regex]::Escape($_) }).Count -eq 0) { break }
            Start-Sleep -Seconds 3
          }
          Start-Sleep -Seconds 5
          $alive = -not $p.HasExited
          Write-Host "App alive: $alive"
          Write-Host "Nightmoth processes:"
          Get-CimInstance Win32_Process -Filter "Name='nightmoth.exe'" | ForEach-Object { Write-Host "  $($_.ProcessId) $($_.CommandLine)" }
          Write-Host "Scheduled task:"
          schtasks /Query /TN "Nightmoth Engine" 2>&1 | Write-Host
          Write-Host "----- app log (AppData) -----"
          Get-Content "$env:APPDATA\Nightmoth\nightmoth.log" -ErrorAction SilentlyContinue
          Write-Host "----- engine log (ProgramData) -----"
          Get-Content "$env:ProgramData\Nightmoth\nightmoth.log" -ErrorAction SilentlyContinue
          Write-Host "----- crash logs -----"
          Get-Content "$env:APPDATA\Nightmoth\crash.log" -ErrorAction SilentlyContinue
          Get-Content "$env:ProgramData\Nightmoth\crash.log" -ErrorAction SilentlyContinue
          Write-Host "----- engine folder permissions -----"
          icacls "$env:ProgramData\Nightmoth" | Write-Host
          $log = Get-Content "$env:APPDATA\Nightmoth\nightmoth.log" -Raw -ErrorAction SilentlyContinue
          $elog = Get-Content "$env:ProgramData\Nightmoth\nightmoth.log" -Raw -ErrorAction SilentlyContinue
          Get-Process nightmoth -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $alive) { Write-Error "Nightmoth exited during startup"; exit 1 }
          if ($log -notmatch "main window ready") { Write-Error "Main window UI never loaded"; exit 1 }
          if ($elog -notmatch "engine ready") { Write-Error "Engine never started"; exit 1 }
          if ($elog -match "refused a connection") { Write-Error "Engine refused Nightmoth's own app"; exit 1 }
          if ($log -notmatch "app: engine connected") { Write-Error "App never connected to the engine"; exit 1 }
          if ($log -notmatch "widgets window created") { Write-Error "Desktop widgets never appeared"; exit 1 }
          Write-Host "SMOKE TEST PASSED"

      # Every push to main refreshes the "latest" release in this repo.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest src-tauri/target/release/bundle/nsis/*.exe \
            --title "Nightmoth (latest build)" --prerelease --target "$GITHUB_SHA" \
            --notes "Built from $GITHUB_SHA. Windows may show a SmartScreen warning: click More info → Run anyway."

      # Push a tag like v0.1.0 for a proper versioned release.
      - name: Publish version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe \
            --title "Nightmoth $GITHUB_REF_NAME" \
            --notes "Windows may show a SmartScreen warning: click More info → Run anyway."
